trigger:
  branches:
    include:
      - master
      - main
  paths:
    include:
      - "Azure DevOps pipeline + Terraform Deployment/*"

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceConnection: 'azure-spn-conn'
  workingDir: '$(System.DefaultWorkingDirectory)/Azure DevOps pipeline + Terraform Deployment'

stages:
- stage: TerraformPlan
  displayName: 'Terraform Init & Plan'
  jobs:
  - job: Plan
    steps:
    - task: AzureCLI@2
      displayName: 'Install Terraform & Run Plan'
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: $(workingDir)
        inlineScript: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install terraform

          terraform init
          terraform validate
          terraform plan

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - job: Apply
    steps:
    - task: AzureCLI@2
      displayName: 'Install Terraform & Run Apply'
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: $(workingDir)
        inlineScript: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install terraform

          terraform init
          terraform apply -auto-approve
